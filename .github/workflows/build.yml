name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor y generar proyecto Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Contabilidad 1.0" "com.lafabricapp.contabilidad10" --web-dir=www
          npx cap add android
          node -e 'const fs=require("fs");const p="android/app/build.gradle";if(fs.existsSync(p)){let g=fs.readFileSync(p,"utf8");g=g.replace(/versionCode\s+\d+/,"versionCode 1");g=g.replace(/versionName\s+"[^"]*"/,"versionName \"1.0.0\"");fs.writeFileSync(p,g);}'
          npx cap sync android
          ls -la icon.png || echo "NO HAY icon.png EN RAIZ"
          if [ -f "icon.png" ]; then
            node -e 'const fs=require("fs"),path=require("path"),{execFileSync}=require("child_process");const src=path.resolve("icon.png"),resBase=path.resolve("android/app/src/main/res");const sizes={"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192};let ok=false;for(const [folder,px] of Object.entries(sizes)){const dir=path.join(resBase,folder);if(!fs.existsSync(dir))continue;const mainPng=path.join(dir,"ic_launcher.png");try{execFileSync("convert",[src,"-resize",px+"x"+px,mainPng],{stdio:"ignore"});ok=true;}catch(_){try{execFileSync("ffmpeg",["-y","-i",src,"-vf","scale="+px+":"+px,mainPng],{stdio:"ignore"});ok=true;}catch(__){fs.copyFileSync(src,mainPng);ok=true;}}for(const extra of ["ic_launcher_round.png","ic_launcher_foreground.png"]){fs.copyFileSync(mainPng,path.join(dir,extra));}}console.log("ICONO APLICADO:",ok);'
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi
      - name: Compilar APK Debug (sin firma release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Subir artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error